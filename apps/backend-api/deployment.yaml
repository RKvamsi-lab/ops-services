apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend-api

  template:
    metadata:
      labels:
        app: backend-api

    spec:
      containers:
        - name: backend-api

          image: 719572784863.dkr.ecr.us-east-1.amazonaws.com/backend-api:v1
          imagePullPolicy: Always

          securityContext:
            privileged: false

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-api-secret
                  key: DATABASE_URL

            - name: PORT
              value: "8080"

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5