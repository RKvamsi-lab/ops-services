apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-api

env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: backend-api-secret
        key: ops-center-postgres.cizecm0w4phr.us-east-1.rds.amazonaws.com:5432

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend-api

  template:
    metadata:
      labels:
        app: backend-api

    spec:
      containers:
        - name: backend-api
          image: 719572784863.dkr.ecr.us-east-1.amazonaws.com/backend-api
          imagePullPolicy: Always

          ports:
            - containerPort: 8080