apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-ui

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend-ui

  template:
    metadata:
      labels:
        app: frontend-ui

    spec:
      containers:
        - name: frontend-ui
          image: 719572784863.dkr.ecr.us-east-1.amazonaws.com/frontend-ui:0284ae5a017cf42597092cd7e159eff26348c429
          imagePullPolicy: Always

          ports:
            - containerPort: 80