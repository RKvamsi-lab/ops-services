apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-ui

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend-ui

  template:
    metadata:
      labels:
        app: frontend-ui

    spec:
      containers:
        - name: frontend-ui
          image: 719572784863.dkr.ecr.ap-south-1.amazonaws.com/frontend-ui:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80