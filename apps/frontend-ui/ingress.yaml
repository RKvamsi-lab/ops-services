apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: frontend-ui

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/group.name: platform

    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:719572784863:certificate/009b30bf-e069-454a-8bb1-bf823cfb1b99

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'

    alb.ingress.kubernetes.io/ssl-redirect: '443'

    external-dns.alpha.kubernetes.io/hostname: app-dev.rk-labs.xyz

spec:
  ingressClassName: alb

  rules:
  - host: app-dev.rk-labs.xyz

    http:

      paths:

      - path: /

        pathType: Prefix

        backend:

          service:
            name: frontend-ui

            port:
              number: 80