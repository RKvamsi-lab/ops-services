apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: external-secrets-resources
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/RKvamsi-lab/ops-services.git
    targetRevision: main
    path: platform/external-secrets

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true