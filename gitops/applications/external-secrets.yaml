apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: backend-api
  namespace: backend-api

spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io

    chart: external-secrets

    targetRevision: 0.18.2

    helm:
      values: |
        installCRDs: true

        replicaCount: 2

        resources:
          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true