apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: frontend-ui
  namespace: argocd

  annotations:
    argocd-image-updater.argoproj.io/image-list: frontend-ui=719572784863.dkr.ecr.us-east-1.amazonaws.com/frontend-ui

    argocd-image-updater.argoproj.io/frontend-ui.update-strategy: newest-build

    argocd-image-updater.argoproj.io/frontend-ui.allow-tags: regexp:^[a-f0-9]{40}$

    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/write-back-target: kustomization

spec:
  project: default

  source:
    repoURL: https://github.com/RKvamsi-lab/ops-services.git
    targetRevision: main
    path: apps/frontend-ui

  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-ui

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true