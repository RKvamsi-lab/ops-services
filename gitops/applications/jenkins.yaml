apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: jenkins
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://charts.jenkins.io
    chart: jenkins
    targetRevision: 5.8.60

    helm:
      values: |
        controller:

          admin:
            createSecret: true
            username: admin

          serviceType: ClusterIP

          installPlugins:
            - kubernetes
            - workflow-aggregator
            - git
            - github
            - docker-workflow
            - configuration-as-code:1985.vdda_32d0c4ea_b_
            - blueocean

          persistence:
            enabled: true
            storageClass: gp3
            size: 30Gi

          resources:
            requests:
              cpu: 500m
              memory: 1Gi

            limits:
              cpu: 2000m
              memory: 4Gi

          ingress:
            enabled: false

        agent:
          enabled: true

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: 1000m
              memory: 2Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true