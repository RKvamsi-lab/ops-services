apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: job-bot
  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://github.com/RKvamsi-lab/ops-services.git

    targetRevision: main

    path: apps/job-bot

  destination:

    server: https://kubernetes.default.svc

    namespace: job-bot

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:
      - CreateNamespace=true