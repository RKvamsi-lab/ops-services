apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: karpenter-resources
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: default

  source:
    repoURL: https://github.com/RKvamsi-lab/ops-services.git
    targetRevision: main
    path: platform/karpenter/resources

  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter

  syncPolicy:
    automated:
      prune: true
      selfHeal: true