apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: prometheus-resources
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/RKvamsi-lab/ops-services.git
    targetRevision: main
    ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true