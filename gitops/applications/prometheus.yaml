apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: prometheus
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 27.23.0

    helm:
      values: |
        alertmanager:
          enabled: true

          extraSecretMounts:
          - name: alertmanager-slack
            secretName: alertmanager-slack
            mountPath: /etc/alertmanager/secrets/alertmanager-slack
            readOnly: true

          persistence:
            enabled: true
            storageClass: gp3
            size: 5Gi

          config:
            global:
              resolve_timeout: 5m

            route:
              receiver: slack-notifications
              group_by:
                - alertname
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h

            receivers:
              - name: slack-notifications
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
                    channel: "#ops-app-alerts"
                    send_resolved: true
                    title: "{{ .CommonAnnotations.summary }}"
                    text: |
                      *Alert:* {{ .CommonLabels.alertname }}
                      *Severity:* {{ .CommonLabels.severity }}
                      *Description:* {{ .CommonAnnotations.description }}

        server:
          persistentVolume:
            enabled: true
            storageClass: gp3
            size: 20Gi

          retention: 15d

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: 1000m
              memory: 2Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true