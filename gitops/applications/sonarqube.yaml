apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sonarqube
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://SonarSource.github.io/helm-chart-sonarqube
    chart: sonarqube
    targetRevision: 2026.4.0

    helm:
      values: |
        persistence:
          enabled: true
          storageClass: gp3
          size: 20Gi

        resources:
          requests:
            cpu: 500m
            memory: 2Gi

          limits:
            cpu: 2000m
            memory: 4Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true