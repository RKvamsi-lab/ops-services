apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sonarqube
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://SonarSource.github.io/helm-chart-sonarqube
    chart: sonarqube
    targetRevision: 2026.1.0

    helm:
      values: |
        community:
          enabled: true

        persistence:
          enabled: true
          size: 20Gi

        monitoringPasscode: sonarqube

        ingress:
          enabled: true

          annotations:
            kubernetes.io/ingress.class: alb
            alb.ingress.kubernetes.io/group.name: platform
            alb.ingress.kubernetes.io/scheme: internet-facing
            alb.ingress.kubernetes.io/target-type: ip
            alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
            alb.ingress.kubernetes.io/ssl-redirect: "443"
            alb.ingress.kubernetes.io/certificate-arn: <YOUR ACM ARN>

          hosts:
            - name: sonarqube.rk-labs.xyz
              path: /
              pathType: Prefix

  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube

  syncPolicy:
    automated:
      prune: true
      selfHeal: true