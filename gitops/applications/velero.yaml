apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: velero
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts

    chart: velero

    targetRevision: 10.1.0

    helm:
      values: |
        configuration:

          backupStorageLocation:

            - name: default

              provider: aws

              bucket: rk-labs-velero-backups

              config:
                region: us-east-1

          volumeSnapshotLocation:

            - name: default

              provider: aws

              config:
                region: us-east-1

        snapshotsEnabled: true

        deployNodeAgent: true

  destination:
    server: https://kubernetes.default.svc
    namespace: velero

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true