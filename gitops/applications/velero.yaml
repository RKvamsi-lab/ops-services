apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: velero
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.0.2

    helm:
      values: |
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: rk-labs-velero-backups

              config:
                region: us-east-1

          volumeSnapshotLocation:
            - name: default
              provider: aws

              config:
                region: us-east-1

        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.13.0

            volumeMounts:
              - mountPath: /target
                name: plugins

        snapshotsEnabled: true

        deployNodeAgent: true

        credentials:
          useSecret: false

        serviceAccount:
          create: true
          name: velero

          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::719572784863:role/rk-labs-velero

  destination:
    server: https://kubernetes.default.svc
    namespace: velero

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true