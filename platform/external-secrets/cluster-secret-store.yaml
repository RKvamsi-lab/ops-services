apiVersion: external-secrets.io/v1
kind: ClusterSecretStore

metadata:
  name: aws-ssm
  name: aws-secretsmanager

spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      service: ParameterStore
      region: us-east-1

      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets