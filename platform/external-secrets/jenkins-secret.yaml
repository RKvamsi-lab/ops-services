apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: jenkins-admin-secret
  namespace: jenkins

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore

  target:
    name: jenkins-admin-secret
    creationPolicy: Owner

  data:
    - secretKey: admin-user
      remoteRef:
        key: /platform/jenkins/admin-user

    - secretKey: admin-password
      remoteRef:
        key: /platform/jenkins/admin-password