admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: true
  storageClassName: gp3
  size: 10Gi

deploymentStrategy:
  type: Recreate

service:
  type: ClusterIP

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

grafana.ini:
  server:
    root_url: https://grafana.rk-labs.xyz

ingress:
  enabled: false