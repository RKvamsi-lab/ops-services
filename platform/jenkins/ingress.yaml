apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: jenkins
  namespace: jenkins

  annotations:

    kubernetes.io/ingress.class: alb

    alb.ingress.kubernetes.io/scheme: internet-facing

    alb.ingress.kubernetes.io/target-type: ip

    external-dns.alpha.kubernetes.io/hostname: jenkins.rk-labs.xyz

spec:

  ingressClassName: alb

  rules:

  - host: jenkins.rk-labs.xyz

    http:

      paths:

      - path: /

        pathType: Prefix

        backend:

          service:

            name: jenkins

            port:

              number: 8080