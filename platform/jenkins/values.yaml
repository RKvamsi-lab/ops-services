controller:

  admin:

    createSecret: true

    username: admin

  serviceType: ClusterIP

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - github
    - docker-workflow
    - configuration-as-code
    - blueocean

  persistence:

    enabled: true

    storageClass: gp3

    size: 30Gi

  resources:

    requests:
      cpu: 500m
      memory: 1Gi

    limits:
      cpu: 2000m
      memory: 4Gi

  ingress:
    enabled: false

agent:
  enabled: true

  resources:

    requests:
      cpu: 250m
      memory: 512Mi

    limits:
      cpu: 1000m
      memory: 2Gi