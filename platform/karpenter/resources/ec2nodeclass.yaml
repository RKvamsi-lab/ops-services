apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass

metadata:
  name: default

spec:
  amiFamily: AL2023

  amiSelectorTerms:
    - alias: al2023@latest

  role: dev-eks-node-role

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: dev-eks

  securityGroupSelectorTerms:

    # Node SG
    - id: sg-024b98e4d3059b63a

    # EKS Cluster SG
    - id: sg-0d6cc236e13f23f69

  tags:
    karpenter.sh/discovery: dev-eks