apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: blackbox-exporter

  template:
    metadata:
      labels:
        app: blackbox-exporter

    spec:
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:latest

          args:
            - --config.file=/etc/blackbox/blackbox.yml

          ports:
            - containerPort: 9115

          volumeMounts:
            - name: config
              mountPath: /etc/blackbox

      volumes:
        - name: config
          configMap:
            name: blackbox-config

---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring

spec:
  selector:
    app: blackbox-exporter

  ports:
    - name: http
      port: 9115
      targetPort: 9115

---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: external-endpoints
  namespace: monitoring

spec:
  jobName: external-endpoints

  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115

  module: http_2xx

  targets:
    staticConfig:
      static:
        - https://grafana.rk-labs.xyz
        - https://jenkins.rk-labs.xyz
        - https://sonarqube.rk-labs.xyz
        - https://vault.rk-labs.xyz
        - https://app.rk-labs.xyz
        - https://api.rk-labs.xyz/health