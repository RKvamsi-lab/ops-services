apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: prometheus

  namespace: monitoring

  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: platform

spec:
  ingressClassName: alb

  rules:
    - host: prometheus.rk-labs.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-server
                port:
                  number: 80