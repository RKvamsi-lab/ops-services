apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slack-test
  namespace: monitoring
spec:
  groups:
  - name: test
    rules:
    - alert: SlackTestAlert
      expr: vector(1)
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: Slack test alert
        description: Alertmanager Slack integration is working