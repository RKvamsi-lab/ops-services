crds:
  enabled: false

grafana:
  enabled: true

  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi

prometheus:
  prometheusSpec:
    probeSelectorNilUsesHelmValues: false
    probeSelector: {}

    retention: 15d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3

          accessModes:
            - ReadWriteOnce

          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true

  alertmanagerSpec:
    secrets:
      - alertmanager-slack-secret

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3

          accessModes:
            - ReadWriteOnce

          resources:
            requests:
              storage: 5Gi

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: slack

    receivers:
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-secret/slack_api_url
            channel: "#ops-app-alerts"
            send_resolved: true
            
prometheus-node-exporter:
  enabled: true

kubeStateMetrics:
  enabled: true

defaultRules:
  create: true