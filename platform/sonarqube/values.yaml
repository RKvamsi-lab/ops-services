community:
  enabled: true

persistence:
  enabled: true
  storageClass: gp3
  size: 20Gi

resources:
  requests:
    cpu: 500m
    memory: 2Gi

  limits:
    cpu: 2000m
    memory: 4Gi

postgresql:
  enabled: true

  primary:
    persistence:
      enabled: true
      storageClass: gp3
      size: 10Gi

service:
  type: ClusterIP