server:
  enabled: true
  replicas: 1

  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::719572784863:role/dev-vault-irsa

  extraEnvironmentVars:
    AWS_REGION: us-east-1

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/vault/data"
      }

      seal "awskms" {
        region     = "us-east-1"
        kms_key_id = "53267b27-93d7-4ea3-b187-85291ffecb4d"
      }

  dataStorage:
    enabled: true
    storageClass: gp3
    size: 20Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  ingress:
    enabled: true
    ingressClassName: alb

    hosts:
      - host: vault.rk-labs.xyz

    annotations:
      kubernetes.io/ingress.class: alb
      alb.ingress.kubernetes.io/group.name: platform
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:719572784863:certificate/009b30bf-e069-454a-8bb1-bf823cfb1b99
      external-dns.alpha.kubernetes.io/hostname: vault.rk-labs.xyz

ui:
  enabled: true

injector:
  enabled: true