      memory: 512Mi

    limits:
      cpu: 1000m
      memory: 2Gi

  dataStorage:
    enabled: true

    storageClass: gp3

    size: 20Gi

  standalone:
    enabled: true

ui:
  enabled: true

injector:
  enabled: true